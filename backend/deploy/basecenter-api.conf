# Public URL: https://basecenter-api.abacusai.cloud  ->  server_name basecenter-api.vm.internal
# Reverse-proxies to the FastAPI backend (uvicorn) on 127.0.0.1:8010.
server {
    listen 80;
    server_name basecenter-api.vm.internal;

    add_header Cache-Control "max-age=0, s-maxage=60";

    # Uploaded media (Phase 2B CMS) — served directly from local disk.
    location /media/ {
        alias /home/ubuntu/basecenter_uploads/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
